name: panchang
description: An offline Gujarati Hindu calendar powered by a pure Dart astronomy engine.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  geolocator: ^13.0.2
  intl: ^0.19.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/panchang_logo.svg
    - assets/brand/panchang_logo.png
  fonts:
    - family: NotoGujarati
      fonts:
        - asset: assets/fonts/NotoSansGujarati-Regular.ttf
        - asset: assets/fonts/NotoSansGujarati-Bold.ttf
          weight: 700
    - family: NotoDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
